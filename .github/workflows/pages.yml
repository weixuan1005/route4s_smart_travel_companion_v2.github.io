# Publishes the frontend/ folder to GitHub Pages as the site root.
# GitHub Pages is static hosting: the app runs, but the backend features
# (OneMap search, OSRM street legs, live DataMall data) need the backend server.
#
# Manual-only on purpose. This repository's Pages source is "Deploy from a
# branch" (main / root), so GitHub's own Jekyll builder already deploys on
# every push to main. Running both on the same push made two deployments race,
# and whichever finished last decided whether the app was served at / or at
# /frontend/. The root index.html redirects to frontend/ instead.
# If you switch Pages to "GitHub Actions" as the source, restore the push
# trigger here and delete the root index.html redirect.
name: Deploy frontend to GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the frontend folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
