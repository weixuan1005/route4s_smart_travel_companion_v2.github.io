# Publishes the frontend/ folder to GitHub Pages on every push to main.
# GitHub Pages is static hosting: the app runs, but the backend features
# (OneMap search, OSRM street legs, live DataMall data) need the backend server.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the frontend folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
